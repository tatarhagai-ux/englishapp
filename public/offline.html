<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Speakwise</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0d14;color:#eef0f8;font-family:system-ui,Segoe UI,Arial,sans-serif;text-align:center;padding:0 16px}
  h1{font-size:22px;margin:16px 0 6px}p{color:#a3a9c2;margin:0 0 20px;max-width:340px}
  button{border:0;border-radius:999px;padding:12px 22px;font-weight:600;color:#fff;background:linear-gradient(135deg,#7c5cff,#3ee6c1)}
  nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
  nav a{color:#eef0f8;border:1px solid #2a2f45;border-radius:12px;padding:10px 14px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" width="72" height="72" alt="">
  <h1>You're offline</h1>
  <p>Conversations need a connection. These work offline once you've opened them before:</p>
  <nav>
    <a href="/review">Quick review</a>
    <a href="/phrases">Phrase bank</a>
    <a href="/progress">Progress</a>
  </nav>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
